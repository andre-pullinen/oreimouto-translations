name: Validate Translations

on:
  push:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'template/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'locales/**'
      - 'template/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Validation Suite
        run: |
          python tools/validate.py --all

      - name: Test Build Packages
        run: |
          mkdir -p dist
          for locale_dir in locales/*/; do
            loc=$(basename "$locale_dir")
            pck_loc=$(python -c "import json, os, sys; m = json.load(open(os.path.join(sys.argv[1], 'manifest.json'), encoding='utf-8')) if os.path.isfile(os.path.join(sys.argv[1], 'manifest.json')) else {}; print(m.get('locale', sys.argv[2]).strip().lower())" "$locale_dir" "$loc")
            echo "Testing PCK build for: $loc ($pck_loc)"
            python tools/build_pck.py "$locale_dir" -o "dist/lang_${pck_loc}.pck"
          done
          ls -lh dist/
